<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Aqua starter application">
  <meta name="theme-color" content="#00695c">
  <title>Aqua</title>
  <base href="./">
  <link rel="icon" href="icons/favicon.ico">
  <link rel="manifest" href="manifest.json">
  <link href="css/quasar.prod.css" rel="stylesheet">
  <link href="css/fonts.css" rel="stylesheet">
  <link href="css/app.css?v=17" rel="stylesheet">
  <link href="css/transitions.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
  <div id="q-app">
    <div class="q-pa-lg">Loading Aqua...</div>
  </div>

  <script src="js/vue.global.prod.js"></script>
  <script src="js/vue-router.global.prod.js"></script>
  <script src="js/quasar.umd.prod.js"></script>
  <script src="js/en-US.umd.prod.js"></script>
  <script src="js/fr.umd.prod.js"></script>
  <script src="js/ar.umd.prod.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const { createApp } = Vue;
    const { createRouter, createWebHashHistory } = VueRouter;

    const quasarUserOptions = {
      config: {
        brand: {
          primary: '#00695c',
          secondary: '#26A69A',
          accent: '#0D47A1',
          dark: '#1D1D1D',
          positive: '#21BA45',
          negative: '#C10015',
          info: '#31CCEC',
          warning: '#F2C037'
        }
      }
    };

    const loadedComponents = {};
    const components = [
      { name: 'MainLayout', path: './src/layouts/MainLayout.js?v=' + Date.now() },
      { name: 'PageHome', path: './src/pages/PageHome.js?v=' + Date.now() },
      { name: 'PageMap', path: './src/pages/PageMap.js?v=' + Date.now() },
      { name: 'PageLogin', path: './src/pages/PageLogin.js?v=' + Date.now() }
    ];

    function loadComponent(component) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = component.path;
        script.onload = () => {
          loadedComponents[component.name] = true;
          resolve();
        };
        script.onerror = () => reject(new Error('Failed to load component: ' + component.name));
        document.body.appendChild(script);
      });
    }

    function showError(error) {
      document.getElementById('q-app').innerHTML = `
        <div style="padding:24px;font-family:Arial,sans-serif;color:#b71c1c">
          <h2>Aqua failed to start</h2>
          <pre style="white-space:pre-wrap">${error.message}</pre>
        </div>
      `;
      console.error(error);
    }

    async function initializeApp() {
      try {
        for (const component of components) {
          await loadComponent(component);
        }

        const { createAppRouter } = await import('./src/router/routes.js');
        const basePath = window.location.pathname.includes('/aqua/') ? '/aqua/' : '/';
        const router = createAppRouter(basePath);
        const app = createApp({ template: '<router-view></router-view>' });

        app.use(Quasar, quasarUserOptions);
        app.use(router);
        app.mount('#q-app');
      } catch (error) {
        showError(error);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initializeApp);
    } else {
      initializeApp();
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch((error) => {
        console.warn('Service worker registration failed:', error);
      });
    }
  </script>
</body>
</html>
